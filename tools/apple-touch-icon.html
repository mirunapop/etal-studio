<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>apple-touch-icon template</title>
<!-- Template for /apple-touch-icon.png (180×180). Same mark as favicon.svg, but square:
     iOS rounds the corners itself, and transparent corners would turn black. -->
<style>
  html,body{margin:0; width:180px; height:180px; overflow:hidden; background:#14534A}
  svg{display:block}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180"><rect width="64" height="64" fill="#14534A"/><text x="32" y="43" font-family="Georgia,serif" font-size="30" font-weight="700" text-anchor="middle" fill="#F3F2EC">al.</text></svg>
</body>
</html>
